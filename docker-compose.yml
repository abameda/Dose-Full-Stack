# Local development Postgres. The passwords below are fixed, dev-only values for this
# container; they are not secrets and are never used outside a developer machine or CI.
# Start with `docker compose up -d`; stop with `docker compose down` (add -v to wipe data).
services:
  postgres:
    image: postgres:18
    environment:
      # POSTGRES_USER becomes the cluster superuser: it is the migration owner (`dose_owner`).
      # The `dose_app` application role is created by migration 0001.
      POSTGRES_USER: dose_owner
      POSTGRES_PASSWORD: dose_owner_local
      POSTGRES_DB: dose
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - dose-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dose_owner -d dose']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  dose-postgres-data:
