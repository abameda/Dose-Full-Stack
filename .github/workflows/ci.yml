name: CI

on:
  pull_request:
  push:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Same fixed, dev-only values as docker-compose.yml; the tests default to them.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dose_owner
          POSTGRES_PASSWORD: dose_owner_local
          POSTGRES_DB: dose
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U dose_owner -d dose"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # TEMPORARY DEBUG (removed in the next commit): list what gitleaks flagged, redacted, as annotations.
      - name: Debug gitleaks findings
        if: failure()
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --redact --no-banner --report-format json --report-path r.json --exit-code 0 || true
          node -e "for (const f of require(\"./r.json\")) console.log(\"::warning title=gitleaks::\" + f.RuleID + \" \" + f.File + \":\" + f.StartLine + \" \" + f.Commit.slice(0, 7))"
      - run: pnpm audit --prod --audit-level high

  # The same Postgres service, the real Worker (`astro build`, then `wrangler dev` with local R2 and
  # Hyperdrive) and Playwright on iPhone (WebKit) and Pixel (Chromium). playwright.config.ts seeds
  # the `dose_e2e` database and starts the Worker itself.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dose_owner
          POSTGRES_PASSWORD: dose_owner_local
          POSTGRES_DB: dose
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U dose_owner -d dose"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium webkit

      - run: pnpm e2e

      # Traces are kept for failing tests only (`trace: retain-on-failure`), so a green run uploads
      # the HTML report alone.
      - name: Upload Playwright report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Speed and accessibility budget for the Direction 0 product page, in both languages
  # (lighthouserc.cjs): Lighthouse mobile emulation, three runs each, median of the three.
  # lhci seeds the `dose_lhci` database and starts the Worker itself.
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dose_owner
          POSTGRES_PASSWORD: dose_owner_local
          POSTGRES_DB: dose
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U dose_owner -d dose"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lhci

      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 14
