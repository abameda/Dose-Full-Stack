name: CI

on:
  pull_request:
  push:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Same fixed, dev-only values as docker-compose.yml; the tests default to them.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dose_owner
          POSTGRES_PASSWORD: dose_owner_local
          POSTGRES_DB: dose
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U dose_owner -d dose"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm audit --prod --audit-level high
