packages:
  - packages/*
  - directions/*
  - apps/*
  # The proof-of-concept runner of Milestone 1 (Task 19); removed with the proof after Gate 1.
  - poc
minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.72.0'
  - '@typescript-eslint/parser@8.72.0'
  - '@typescript-eslint/project-service@8.72.0'
  - '@typescript-eslint/scope-manager@8.72.0'
  - '@typescript-eslint/tsconfig-utils@8.72.0'
  - '@typescript-eslint/type-utils@8.72.0'
  - '@typescript-eslint/types@8.72.0'
  - '@typescript-eslint/typescript-estree@8.72.0'
  - '@typescript-eslint/utils@8.72.0'
  - '@typescript-eslint/visitor-keys@8.72.0'
  - typescript-eslint@8.72.0

# esbuild (pulled in by tsx and wrangler) and workerd (the Workers runtime, pulled in by wrangler)
# have install scripts that only optimise their launchers; the platform binaries arrive as
# optional dependencies without them.
allowBuilds:
  esbuild: false
  workerd: false

# @astrojs/cloudflare asks for @cloudflare/vite-plugin ^1.53.0; pin the release built against the
# pinned wrangler (4.147.0), so the plugin and the CLI run the same workerd and miniflare.
overrides:
  '@cloudflare/vite-plugin': 1.62.5
  # miniflare (inside wrangler) pins an older sharp that `pnpm audit` flags (GHSA-wq5f-xc86-pv6w,
  # patched in 0.35.5); run the release the seed already uses.
  sharp: 0.35.5
